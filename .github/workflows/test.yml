name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One file at a time: two test files run build.mjs, and both rewrite dist/.
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: node tools/slack-card-test.mjs
      - run: node tools/email-test.mjs
      - run: node build.mjs
