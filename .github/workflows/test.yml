name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: Article dates and sitemap lastmod come from git log.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Each test file builds into its own temp dir, so files can run in parallel.
      - run: node --test tests/*.test.mjs
      - run: node tools/slack-card-test.mjs
      - run: node tools/email-test.mjs
      - run: node build.mjs
